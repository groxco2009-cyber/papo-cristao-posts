name: Postar no Papo Cristão

# Horários em UTC (Brasília = UTC-3): 07:00, 10:30, 13:00, 18:00 e 20:30
on:
  schedule:
    - cron: "0 10 * * *"   # 07:00 -> post de imagem (bom dia / fé)
    - cron: "30 13 * * *"  # 10:30 -> reel
    - cron: "0 16 * * *"   # 13:00 -> carrossel
    - cron: "0 21 * * *"   # 18:00 -> post de imagem (reflexão / dica)
    - cron: "30 23 * * *"  # 20:30 -> story
  workflow_dispatch:
    inputs:
      slot:
        description: "Qual post? (1 a 5)"
        default: "1"
      teste:
        description: "Modo teste (não publica de verdade)?"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Descobrir qual post é
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
            echo "dry=${{ github.event.inputs.teste }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 10 * * *")  s=1;;
              "30 13 * * *") s=2;;
              "0 16 * * *")  s=3;;
              "0 21 * * *")  s=4;;
              "30 23 * * *") s=5;;
              *) s=1;;
            esac
            echo "slot=$s" >> $GITHUB_OUTPUT
            echo "dry=false" >> $GITHUB_OUTPUT
          fi

      - name: Gerar arte / vídeo e legenda
        run: python src/main.py gerar --slot ${{ steps.slot.outputs.slot }} --out out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Colocar arquivos no ar (a Meta precisa de links públicos)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publicar no Instagram e no Facebook
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          DRY=""
          if [ "${{ steps.slot.outputs.dry }}" = "true" ]; then DRY="--dry-run"; fi
          python src/main.py publicar --slot ${{ steps.slot.outputs.slot }} --out out \
            --base-url "${{ steps.deployment.outputs.page_url }}" $DRY

      - name: Salvar andamento da fila
        if: always()
        run: |
          git config user.name "papo-cristao-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "estado: atualiza fila de posts"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push || true
          fi
