name: Postar no Papo Cristão

# O robô acorda a cada 30 minutos (em minutos "quebrados", que o GitHub respeita mais)
# e vê qual post está na hora ou atrasado. Horários dos posts (Brasília):
# 07:00 imagem | 10:30 reel | 13:00 carrossel | 18:00 imagem | 20:30 story
# Se o GitHub atrasar ou pular um disparo, o próximo recupera o post pendente.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Qual post? (1 a 5)"
        default: "1"
      teste:
        description: "Modo teste (não publica de verdade)?"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descobrir qual post é
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
            echo "dry=${{ github.event.inputs.teste }}" >> $GITHUB_OUTPUT
          else
            s=$(python src/main.py proximo)
            echo "Post da vez: $s (0 = nenhum agora)"
            echo "slot=$s" >> $GITHUB_OUTPUT
            echo "dry=false" >> $GITHUB_OUTPUT
          fi

      - name: Instalar dependências
        if: steps.slot.outputs.slot != '0'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Gerar arte / vídeo e legenda
        if: steps.slot.outputs.slot != '0'
        run: python src/main.py gerar --slot ${{ steps.slot.outputs.slot }} --out out

      - uses: actions/upload-pages-artifact@v3
        if: steps.slot.outputs.slot != '0'
        with:
          path: out

      - name: Colocar arquivos no ar (a Meta precisa de links públicos)
        id: deployment
        if: steps.slot.outputs.slot != '0'
        uses: actions/deploy-pages@v4

      - name: Publicar no Instagram e no Facebook
        if: steps.slot.outputs.slot != '0'
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          DRY=""
          if [ "${{ steps.slot.outputs.dry }}" = "true" ]; then DRY="--dry-run"; fi
          python src/main.py publicar --slot ${{ steps.slot.outputs.slot }} --out out \
            --base-url "${{ steps.deployment.outputs.page_url }}" $DRY

      - name: Salvar andamento da fila
        if: always() && steps.slot.outputs.slot != '0'
        run: |
          git config user.name "papo-cristao-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "estado: atualiza fila de posts"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push || true
          fi
